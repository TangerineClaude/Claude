<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Voice Reply</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #232328;
      --border: #2e2e38;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af5;
      --accent-hover: #9080ff;
      --send: #22c55e;
      --send-hover: #16a34a;
      --danger: #ef4444;
      --bubble-in: #1e1e2a;
      --bubble-out: #3a3060;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1rem;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-send { background: var(--send); color: white; padding: 8px 20px; font-size: 0.85rem; }
    .btn-send:hover { background: var(--send-hover); }
    .btn-send:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

    /* ── Layout ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .thread-list {
      overflow-y: auto;
      flex: 1;
    }

    .thread-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .thread-item:hover { background: var(--surface2); }
    .thread-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }

    .thread-phone {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 3px;
    }

    .thread-snippet {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-date {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .thread-badge {
      background: var(--accent);
      color: white;
      border-radius: 10px;
      font-size: 0.65rem;
      padding: 1px 6px;
      margin-left: 6px;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .conversation-header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .conv-phone {
      font-weight: 600;
      font-size: 1rem;
    }

    .conv-count {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble.incoming {
      background: var(--bubble-in);
      border: 1px solid var(--border);
      align-self: flex-start;
    }

    .bubble.outgoing {
      background: var(--bubble-out);
      align-self: flex-end;
    }

    .bubble-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .bubble-wrap { display: flex; flex-direction: column; }
    .bubble-wrap.out { align-items: flex-end; }
    .bubble-wrap.in { align-items: flex-start; }

    /* ── Reply area ── */
    .reply-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .suggestion-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 28px;
    }

    .suggestion-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .suggestion-text {
      font-size: 0.82rem;
      color: var(--accent-hover);
      flex: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .suggestion-text:hover { background: var(--surface2); }
    .suggestion-text.loading { color: var(--muted); font-style: italic; cursor: default; }

    .use-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .use-btn:hover { background: var(--accent); color: white; }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.875rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    /* ── Empty / Auth states ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }

    .empty-icon { font-size: 3rem; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 0.82rem; max-width: 260px; }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 360px;
      text-align: center;
    }

    .auth-card h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .auth-card p { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.82rem;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }
    .toast.success { border-color: var(--send); }
    .toast.error { border-color: var(--danger); }

    .divider { text-align: center; font-size: 0.72rem; color: var(--muted); margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">📱</div>
      Google Voice Reply
    </div>
    <div class="header-actions" id="headerActions">
      <span id="authStatus" style="font-size:0.78rem;color:var(--muted)"></span>
      <button class="btn btn-ghost" id="refreshBtn" onclick="loadThreads()" style="display:none">↻ Refresh</button>
      <button class="btn btn-ghost" id="logoutBtn" onclick="logout()" style="display:none">Sign out</button>
    </div>
  </header>

  <div class="app" id="app">
    <!-- Loading -->
    <div class="empty-state" id="loading">
      <div class="spinner"></div>
      <div class="empty-sub">Loading…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let threads = [];
    let currentThread = null;
    let currentMessages = [];
    let currentSuggestion = '';

    // ── Init ──────────────────────────────────────────────────────────────────

    async function init() {
      const resp = await fetch('/api/auth/status').then(r => r.json());
      if (!resp.authenticated) {
        showAuthPrompt();
      } else {
        showApp();
        loadThreads();
      }
    }

    function showAuthPrompt() {
      document.getElementById('app').innerHTML = `
        <div class="empty-state">
          <div class="auth-card">
            <div style="font-size:2.5rem;margin-bottom:12px">📱</div>
            <h2>Connect Google Voice</h2>
            <p>Sign in with the Gmail account linked to your Google Voice number. We'll read your Voice messages and help you reply.</p>
            <a href="/auth/login" class="btn btn-primary" style="display:inline-block;text-decoration:none;padding:10px 24px;font-size:0.9rem">
              Sign in with Google
            </a>
            <div style="margin-top:14px;font-size:0.72rem;color:var(--muted)">
              Only Gmail read + send permissions are requested.
            </div>
          </div>
        </div>
      `;
    }

    function showApp() {
      document.getElementById('refreshBtn').style.display = '';
      document.getElementById('logoutBtn').style.display = '';
      document.getElementById('authStatus').textContent = 'Connected';

      document.getElementById('app').innerHTML = `
        <div class="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title">Conversations</span>
            <div id="sidebarSpinner" class="spinner" style="display:none"></div>
          </div>
          <div class="thread-list" id="threadList">
            <div style="padding:20px;text-align:center;color:var(--muted);font-size:0.82rem">Loading…</div>
          </div>
        </div>
        <div class="main" id="main">
          <div class="empty-state">
            <div class="empty-icon">💬</div>
            <div class="empty-title">Select a conversation</div>
            <div class="empty-sub">Pick a Google Voice thread on the left to view messages and get AI reply suggestions.</div>
          </div>
        </div>
      `;
    }

    // ── Threads ───────────────────────────────────────────────────────────────

    async function loadThreads() {
      const spinner = document.getElementById('sidebarSpinner');
      if (spinner) spinner.style.display = '';

      try {
        const data = await fetch('/api/threads').then(r => r.json());
        if (data.error) { showToast(data.error, 'error'); return; }
        threads = data.threads || [];
        renderThreadList();
      } catch (e) {
        showToast('Failed to load threads', 'error');
      } finally {
        if (spinner) spinner.style.display = 'none';
      }
    }

    function renderThreadList() {
      const list = document.getElementById('threadList');
      if (!list) return;

      if (!threads.length) {
        list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.82rem">
          No Google Voice messages found.<br>Make sure Google Voice email notifications are enabled in your Gmail.
        </div>`;
        return;
      }

      list.innerHTML = threads.map(t => `
        <div class="thread-item ${currentThread?.threadId === t.threadId ? 'active' : ''}"
             onclick="openThread('${t.threadId}')">
          <div class="thread-phone">
            ${escHtml(t.phone)}
            <span class="thread-badge">${t.messageCount}</span>
          </div>
          <div class="thread-snippet">${escHtml(t.snippet)}</div>
          <div class="thread-date">${formatDate(t.date)}</div>
        </div>
      `).join('');
    }

    // ── Thread detail ─────────────────────────────────────────────────────────

    async function openThread(threadId) {
      currentThread = threads.find(t => t.threadId === threadId);
      currentSuggestion = '';
      renderThreadList();

      const main = document.getElementById('main');
      main.innerHTML = `<div class="empty-state"><div class="spinner"></div><div class="empty-sub">Loading messages…</div></div>`;

      try {
        const data = await fetch(`/api/thread/${threadId}`).then(r => r.json());
        if (data.error) { showToast(data.error, 'error'); return; }
        currentMessages = data.messages || [];
        renderConversation(data);
        fetchSuggestion();
      } catch (e) {
        showToast('Failed to load thread', 'error');
      }
    }

    function renderConversation(data) {
      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="conversation-header">
          <div>
            <div class="conv-phone">${escHtml(currentThread?.phone || data.from)}</div>
            <div class="conv-count">${currentMessages.length} message${currentMessages.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="messages" id="messages">
          ${renderMessages(data.messages)}
        </div>
        <div class="reply-area">
          <div class="suggestion-bar">
            <span class="suggestion-label">AI</span>
            <span class="suggestion-text loading" id="suggestionText">Generating suggestion…</span>
            <button class="use-btn" id="useBtn" onclick="useSuggestion()" style="display:none">Use</button>
          </div>
          <div class="input-row">
            <textarea id="replyInput" placeholder="Type a reply…" rows="2"
              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="btn btn-send" onclick="sendReply()" id="sendBtn">Send</button>
          </div>
          <div style="font-size:0.7rem;color:var(--muted);margin-top:6px">
            Sent via Gmail reply to Google Voice thread &nbsp;·&nbsp; Enter to new line &nbsp;·&nbsp; Ctrl+Enter to send
          </div>
        </div>
      `;

      scrollToBottom();
    }

    function renderMessages(messages) {
      return messages.map((msg, i) => {
        const isGV = msg.from.toLowerCase().includes('google') || msg.from.toLowerCase().includes('voice');
        const isOut = !isGV;
        const dir = isOut ? 'out' : 'in';
        const cls = isOut ? 'outgoing' : 'incoming';

        if (!msg.body) return '';

        return `
          <div class="bubble-wrap ${dir}">
            <div class="bubble ${cls}">${escHtml(msg.body)}</div>
            <div class="bubble-meta">${formatDate(msg.date)}</div>
          </div>
        `;
      }).join('');
    }

    function scrollToBottom() {
      const el = document.getElementById('messages');
      if (el) el.scrollTop = el.scrollHeight;
    }

    // ── AI Suggestion ─────────────────────────────────────────────────────────

    async function fetchSuggestion() {
      const suggEl = document.getElementById('suggestionText');
      const useBtn = document.getElementById('useBtn');
      if (!suggEl) return;

      try {
        const data = await fetch('/api/suggest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: currentMessages,
            phone: currentThread?.phone,
          }),
        }).then(r => r.json());

        if (data.error) {
          suggEl.textContent = 'Could not generate suggestion';
          suggEl.classList.add('loading');
          return;
        }

        currentSuggestion = data.suggestion;
        suggEl.textContent = data.suggestion;
        suggEl.classList.remove('loading');
        suggEl.onclick = useSuggestion;
        if (useBtn) useBtn.style.display = '';
      } catch (e) {
        suggEl.textContent = 'AI suggestion unavailable';
        suggEl.classList.add('loading');
      }
    }

    function useSuggestion() {
      const input = document.getElementById('replyInput');
      if (input && currentSuggestion) {
        input.value = currentSuggestion;
        autoResize(input);
        input.focus();
      }
    }

    // ── Send ──────────────────────────────────────────────────────────────────

    async function sendReply() {
      const input = document.getElementById('replyInput');
      const sendBtn = document.getElementById('sendBtn');
      const body = input?.value.trim();

      if (!body || !currentThread) return;

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';

      const lastMsg = currentMessages.at(-1);

      try {
        const data = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            threadId: currentThread.threadId,
            to: lastMsg?.from || '',
            subject: currentThread.subject || lastMsg?.subject || '',
            body,
            messageId: lastMsg?.messageId || '',
          }),
        }).then(r => r.json());

        if (data.error) {
          showToast(data.error, 'error');
        } else {
          showToast('Message sent!', 'success');
          input.value = '';
          // Reload thread after short delay so Gmail has the sent message
          setTimeout(() => openThread(currentThread.threadId), 1500);
        }
      } catch (e) {
        showToast('Failed to send', 'error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    }

    // ── Auth ──────────────────────────────────────────────────────────────────

    async function logout() {
      await fetch('/auth/logout');
      location.reload();
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function handleKey(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        sendReply();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        const now = new Date();
        const diff = now - d;
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
        if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      } catch (_) { return dateStr; }
    }

    let toastTimer;
    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    init();
  </script>
</body>
</html>
