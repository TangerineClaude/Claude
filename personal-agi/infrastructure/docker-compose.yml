version: '3.8'

services:
  # Personal AGI Backend
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/personal_agi
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      - db
      - redis
    volumes:
      - sessions-data:/app/.sessions
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_agi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infrastructure/database-schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  # Redis for task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@personal-agi.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  sessions-data:
