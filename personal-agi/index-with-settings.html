<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AGI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #1a1a1a;
      padding: 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 { font-size: 1.5rem; }

    .settings-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .settings-btn:hover { background: #333; }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      margin: 15px 0;
      padding: 12px 16px;
      background: #1a1a1a;
      border-radius: 12px;
      line-height: 1.6;
    }

    .user {
      background: #3b82f6;
      text-align: right;
      margin-left: 60px;
    }

    .assistant {
      margin-right: 60px;
    }

    .input-area {
      background: #1a1a1a;
      padding: 20px;
      border-top: 1px solid #333;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .input-form {
      display: flex;
      gap: 10px;
    }

    #msg {
      flex: 1;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
    }

    #msg:focus { outline: none; border-color: #3b82f6; }

    button {
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: #2563eb; }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }

    .modal-header h2 { font-size: 1.25rem; }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
    }

    .close-btn:hover { color: #fff; }

    .setting-group {
      margin-bottom: 24px;
    }

    .setting-group label {
      display: block;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .setting-group select,
    .setting-group input,
    .setting-group textarea {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .setting-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .setting-group input[type="range"] {
      width: 100%;
    }

    .range-value {
      display: inline-block;
      background: #2a2a2a;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 8px;
    }

    .setting-description {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      margin-top: 16px;
    }

    .save-btn:hover { background: #059669; }

    .model-card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 2px solid transparent;
    }

    .model-card.selected {
      border-color: #3b82f6;
      background: #1e3a5f;
    }

    .model-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .model-desc {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Personal AGI</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <form class="input-form" onsubmit="send(event)">
      <textarea id="msg" placeholder="Ask anything..." rows="1"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Settings</h2>
        <button class="close-btn" onclick="closeSettings()">×</button>
      </div>

      <div class="setting-group">
        <label>Model Selection</label>
        <select id="modelSelect">
          <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (Fast & Free)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (Advanced Reasoning)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
        <div class="setting-description">Choose the AI model for your conversations</div>
      </div>

      <div class="setting-group">
        <label>System Instructions</label>
        <textarea id="systemInstructions" placeholder="You are a helpful AI assistant...">You are a personal AI assistant with memory. Be helpful, concise, and remember our past conversations.</textarea>
        <div class="setting-description">Define how the AI should behave and respond</div>
      </div>

      <div class="setting-group">
        <label>Temperature: <span id="tempValue" class="range-value">1.0</span></label>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="1.0" oninput="updateRangeValue('temperature', 'tempValue')">
        <div class="setting-description">Higher = more creative, Lower = more focused</div>
      </div>

      <div class="setting-group">
        <label>Top P: <span id="topPValue" class="range-value">0.95</span></label>
        <input type="range" id="topP" min="0" max="1" step="0.05" value="0.95" oninput="updateRangeValue('topP', 'topPValue')">
        <div class="setting-description">Nucleus sampling threshold</div>
      </div>

      <div class="setting-group">
        <label>Max Output Tokens</label>
        <input type="number" id="maxTokens" min="100" max="65536" value="8192">
        <div class="setting-description">Maximum length of AI responses</div>
      </div>

      <div class="setting-group">
        <label>Top K</label>
        <input type="number" id="topK" min="1" max="100" value="40">
        <div class="setting-description">Consider top K tokens for sampling</div>
      </div>

      <button class="save-btn" onclick="saveSettings()">💾 Save Settings</button>
    </div>
  </div>

  <script>
    // Load settings from localStorage
    function loadSettings() {
      const settings = JSON.parse(localStorage.getItem('agiSettings') || '{}');

      document.getElementById('modelSelect').value = settings.model || 'gemini-2.0-flash-exp';
      document.getElementById('systemInstructions').value = settings.systemInstructions || 'You are a personal AI assistant with memory. Be helpful, concise, and remember our past conversations.';
      document.getElementById('temperature').value = settings.temperature || 1.0;
      document.getElementById('topP').value = settings.topP || 0.95;
      document.getElementById('maxTokens').value = settings.maxTokens || 8192;
      document.getElementById('topK').value = settings.topK || 40;

      updateRangeValue('temperature', 'tempValue');
      updateRangeValue('topP', 'topPValue');
    }

    function saveSettings() {
      const settings = {
        model: document.getElementById('modelSelect').value,
        systemInstructions: document.getElementById('systemInstructions').value,
        temperature: parseFloat(document.getElementById('temperature').value),
        topP: parseFloat(document.getElementById('topP').value),
        maxTokens: parseInt(document.getElementById('maxTokens').value),
        topK: parseInt(document.getElementById('topK').value)
      };

      localStorage.setItem('agiSettings', JSON.stringify(settings));
      closeSettings();

      // Show confirmation
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.style.background = '#10b981';
      msg.style.textAlign = 'center';
      msg.textContent = '✓ Settings saved!';
      document.getElementById('chat').appendChild(msg);
      setTimeout(() => msg.remove(), 2000);
    }

    function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function updateRangeValue(inputId, displayId) {
      const value = document.getElementById(inputId).value;
      document.getElementById(displayId).textContent = value;
    }

    async function send(e) {
      e.preventDefault();

      const msgInput = document.getElementById('msg');
      const message = msgInput.value.trim();
      if (!message) return;

      msgInput.value = '';
      msgInput.style.height = 'auto';

      // Add user message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = message;
      document.getElementById('chat').appendChild(userMsg);

      // Add typing indicator
      const typingMsg = document.createElement('div');
      typingMsg.className = 'message assistant';
      typingMsg.textContent = '...';
      typingMsg.id = 'typing';
      document.getElementById('chat').appendChild(typingMsg);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

      try {
        // Get settings
        const settings = JSON.parse(localStorage.getItem('agiSettings') || '{}');

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            settings
          })
        });

        const data = await response.json();

        // Remove typing indicator
        document.getElementById('typing').remove();

        // Add AI response
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message assistant';
        aiMsg.textContent = data.message;
        document.getElementById('chat').appendChild(aiMsg);

      } catch (error) {
        document.getElementById('typing').remove();
        const errorMsg = document.createElement('div');
        errorMsg.className = 'message';
        errorMsg.style.background = '#ef4444';
        errorMsg.textContent = 'Error: ' + error.message;
        document.getElementById('chat').appendChild(errorMsg);
      }

      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    // Auto-resize textarea
    document.getElementById('msg').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    // Enter to send, Shift+Enter for new line
    document.getElementById('msg').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(e);
      }
    });

    // Load settings on page load
    loadSettings();
  </script>
</body>
</html>
