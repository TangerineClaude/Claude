<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AGI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1a1a1a;
            padding: 1rem 2rem;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #3b82f6;
        }

        .message-content {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 12px;
            max-width: 600px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: #3b82f6;
        }

        .input-area {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 1.5rem 2rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-form {
            display: flex;
            gap: 1rem;
        }

        #messageInput {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
        }

        #messageInput:focus {
            outline: none;
            border-color: #3b82f6;
        }

        #sendBtn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #sendBtn:hover {
            background: #2563eb;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 0.25rem;
            padding: 1rem;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .welcome {
            text-align: center;
            margin: 4rem auto;
            max-width: 600px;
        }

        .welcome h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .welcome p {
            color: #888;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Personal AGI</h1>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <h2>Welcome to Your Personal AGI</h2>
            <p>I'm here to help. I remember our conversations and learn from them.</p>
        </div>
    </div>

    <div class="input-area">
        <form class="input-form" id="chatForm">
            <textarea
                id="messageInput"
                placeholder="Ask me anything..."
                rows="1"
            ></textarea>
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Handle Enter key
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Send message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Remove welcome message
            const welcome = chatContainer.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(message, 'user');

            // Show typing indicator
            const typingId = showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                // Remove typing indicator
                hideTyping(typingId);

                if (data.success) {
                    addMessage(data.message, 'assistant');
                } else {
                    addMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                hideTyping(typingId);
                addMessage('Error: Failed to connect to server', 'error');
            }
        });

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const avatar = type === 'user' ? '👤' : '🤖';

            messageDiv.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typing-' + Date.now();
            typingDiv.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="message-content">
                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return typingDiv.id;
        }

        function hideTyping(id) {
            const typing = document.getElementById(id);
            if (typing) typing.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history on page load
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (data.success && data.conversations.length > 0) {
                    const welcome = chatContainer.querySelector('.welcome');
                    if (welcome) welcome.remove();

                    data.conversations.reverse().forEach(conv => {
                        addMessage(conv.user_message, 'user');
                        addMessage(conv.agent_response, 'assistant');
                    });
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        loadHistory();
    </script>
</body>
</html>
