<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AGI - Chat Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Personal AGI</h1>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Context Summary</h3>
                    <div id="contextSummary">
                        <p class="loading">Loading...</p>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Active Tasks</h3>
                    <div id="activeTasks">
                        <p class="loading">Loading...</p>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Model Stats</h3>
                    <div id="modelStats">
                        <p class="loading">Loading...</p>
                    </div>
                </div>
            </aside>

            <main class="chat-area">
                <div class="messages" id="messages">
                    <div class="welcome-message">
                        <h2>Welcome to your Personal AGI</h2>
                        <p>I'm your digital extension - here to help with anything you need.</p>
                        <div class="suggestions">
                            <button class="suggestion" onclick="sendSuggestion('Export my ChatGPT chats as PDFs')">
                                Export ChatGPT chats
                            </button>
                            <button class="suggestion" onclick="sendSuggestion('What projects am I working on?')">
                                Show my projects
                            </button>
                            <button class="suggestion" onclick="sendSuggestion('Search my memories for GCP deployment issues')">
                                Search memories
                            </button>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <form id="chatForm">
                        <textarea
                            id="messageInput"
                            placeholder="Ask me anything..."
                            rows="1"
                        ></textarea>
                        <button type="submit" id="sendButton">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </form>
                    <div class="model-selector">
                        <label for="modelSelect">Model:</label>
                        <select id="modelSelect">
                            <option value="auto">Auto (recommended)</option>
                            <option value="claude-sonnet-4">Claude Sonnet 4</option>
                            <option value="claude-opus-4">Claude Opus 4</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        </select>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
